# DEPENDENCIES: camel-kafka, camel-xml-jaxp

- routeConfiguration:
    errorHandler:
      deadLetterChannel:
        deadLetterUri: "kafka:{{kafka.topic.dlq}}?brokers={{kafka.brokers}}"
        redeliveryPolicy:
          maximumRedeliveries: 3
          #redeliveryDelay: "PT2S"

- route:
    id: legado-para-api-producao

    from:
      uri: "platform-http:/pacientes"
      parameters:
        httpMethodRestrict: "POST"
      steps:
        - log: { message: "✅ Requisição autenticada pelo Quarkus. Processando..." }

        - to: { uri: "validator:classpath:schema/paciente.xsd" }

        - setBody:
            simple: >
              {
                "nome": "${xpath(/paciente/nomeCompleto/text())}",
                "bi": "${xpath(/paciente/documento/text())}",
                "nascimento": "${xpath(/paciente/dataNasc/text())}",
                "municipio_codigo": "${xpath(/paciente/codMunicipio/text())}"
              }

        - removeHeaders: { pattern: "*" }
        - setHeader: { name: "Content-Type", constant: "application/json; charset=utf-8" }

        - to: { uri: "http://modern-api:9005/api/pacientes" }

        - setBody: { constant: "Integração realizada com sucesso" }