name: Build and Push Camel Middleware to GHCR

on:
    push:
        branches:
            - main
        paths:
            - "camel-middleware/**" # Só roda se mudar algo no middleware

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}/camel-middleware

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup JBang
              uses: jbangdev/setup-jbang@main

            - name: Export Camel Project to Docker
              working-directory: ./camel-middleware
              run: |
                  # Exporta o projeto Quarkus e gera o Dockerfile
                  jbang app install camel@apache/camel
                  camel jbang export docker \
                    --runtime=quarkus \
                    --files=paciente-route.camel.yaml,schema/paciente.xsd,application.properties \
                    --name=camel-middleware \
                    --group=com.etevaldoantunes

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v5
              with:
                  context: ./camel-middleware # O 'camel jbang export' cria o Dockerfile aqui
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
